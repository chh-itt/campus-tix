brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 宿主机部署时改为公网 IP；容器内互通可用服务名
brokerIP1 = rocketmq-broker
autoCreateTopicEnable = true

# 开发/演示环境降低内存占用（compose 里已通过 JAVA_OPT_EXT 覆盖 JVM 参数）
listenPort = 10911
