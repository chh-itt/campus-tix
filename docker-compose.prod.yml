services:
  mysql:
    image: mysql:8.0.36
    container_name: campustix-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: campustix
      MYSQL_USER: campustix
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campustix123}
    volumes:
      - campustix-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: campustix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - campustix-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: campustix-namesrv
    restart: unless-stopped
    command: sh mqnamesrv

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: campustix-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"

  backend:
    build: ./backend
    container_name: campustix-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/campustix?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: campustix
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-campustix123}
      SPRING_DATA_REDIS_HOST: redis
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      CAMPUSTIX_ORDER_DELAY_IMPL: rocketmq
      PAY_TTL_MINUTES: ${PAY_TTL_MINUTES:-2}
      CAMPUSTIX_MOCK_PAY_SECRET: ${MOCK_PAY_SECRET:-change-me-in-prod}
      ALIPAY_ENABLED: ${ALIPAY_ENABLED:-false}
      CAMPUSTIX_AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CAMPUSTIX_CORS_ALLOWEDORIGINS_0: ${PUBLIC_ORIGIN:-http://localhost:8088}
    ports:
      - "8080:8080"

  frontend:
    image: node:20-alpine
    container_name: campustix-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install -g pnpm@9 && pnpm install && pnpm build && npx -y serve -s dist -l 8088"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    ports:
      - "8088:8088"

volumes:
  campustix-mysql-data:
  campustix-redis-data:
