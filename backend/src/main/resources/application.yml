server:
  port: 8080

spring:
  application:
    name: campus-tix
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/campustix?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:campustix}
    password: ${MYSQL_PASSWORD:campustix123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: campustix-producer
    send-message-timeout: 3000

campustix:
  jwt:
    # 生产环境务必通过环境变量覆盖
    secret: ${JWT_SECRET:dev-only-secret-please-override-0123456789abcdef0123456789abcdef}
    expire-hours: 72
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:8088
      - http://139.224.24.99:8088
  order:
    pay-ttl-minutes: ${PAY_TTL_MINUTES:2}          # 下单后支付窗口（演示 2 分钟，生产建议 15-30）
    delay-level: ${DELAY_LEVEL:6}                  # RocketMQ 延迟档位：6=2m、16=30m
    delay-impl: ${DELAY_IMPL:rocketmq}             # rocketmq | redis（资源受限环境的降级实现）
    waitlist-pay-ttl-minutes: 10                   # 候补转正后的限时支付窗口
  mock-pay:
    secret: ${MOCK_PAY_SECRET:dev-mock-gateway-secret}
  alipay:
    enabled: ${ALIPAY_ENABLED:false}               # 配置沙箱密钥后置为 true
    app-id: ${ALIPAY_APP_ID:}
    app-private-key: ${ALIPAY_APP_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  ai:
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
    rate-limit-per-minute: 10                      # 单用户每分钟提问上限

logging:
  level:
    com.chh.campustix: info
    org.springframework.security: warn
